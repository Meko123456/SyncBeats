name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # No google-services.json here on purpose: it is developer-specific and git-ignored, and
      # composeApp/build.gradle.kts only applies the Google Services plugin when the file exists.
      # This job therefore also proves a fresh clone still builds, which is what a reviewer does.
      - name: Test, build and lint
        run: ./gradlew testDebugUnitTest :composeApp:assembleDebug :composeApp:lintDebug --stacktrace

  instrumented:
    # The playback tests need a real Android runtime: they bind the MediaSession service and decode
    # audio, which no JVM test can do. This is the job that makes a media3 bump reviewable — before
    # it existed the only check was somebody remembering to sign in and press play.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # The ubuntu-latest image leaves ~7 GB free and the emulator wants 7.2 GB for its userdata
      # partition alone — Owlarm's identical job died on exactly this; ours passed with almost no
      # margin. Dropping preinstalled toolchains nobody here uses frees ~15 GB (the JDK lives in
      # the hostedtoolcache, so it stays).
      - name: Free disk space for the emulator
        run: |
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/.ghcup \
                      /usr/local/lib/android/sdk/ndk /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      # The emulator will not start without nested virtualisation available to the runner.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the playback tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # No window, no animations, no audio hardware: the tests assert on player state rather
          # than on sound, so a headless device is the whole story and a much faster one.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # :core:data has the media3 playback tests; :composeApp has the Koin graph test,
          # which is the only thing that proves the nine-module DI graph can actually be built
          # (a missing binding is invisible to the compiler and three ViewModels sit behind sign-in).
          script: ./gradlew :core:data:connectedDebugAndroidTest :composeApp:connectedDebugAndroidTest --stacktrace

      - name: Upload the report when it fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-report
          path: composeApp/build/reports/androidTests/

  ios:
    # Compile only, and deliberately so. The iOS targets cannot be *linked* yet: the GitLive
    # Firebase bindings need the Firebase iOS SDK frameworks, which this repo has no Xcode project
    # or CocoaPods integration for (see the iOS issue). Compiling still catches the regression that
    # actually happens — code in commonMain that only works on the JVM.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile the iOS targets
        run: |
          # :core:model and :core:domain have no Firebase dependency, so their tests LINK and RUN
          # on a simulator — 50 tests actually executed on iOS rather than merely compiled.
          ./gradlew :core:model:iosSimulatorArm64Test \
                    :core:domain:iosSimulatorArm64Test \
                    :core:designsystem:iosSimulatorArm64Test --stacktrace
          # Everything downstream of the GitLive bindings cannot be *linked* until the Firebase
          # iOS SDK is integrated (issue #13), so those stay compile-only. Compiling still catches
          # the regression that actually happens: commonMain code that only works on the JVM.
          ./gradlew :core:data:compileKotlinIosSimulatorArm64 \
                    :composeApp:compileKotlinIosSimulatorArm64 \
                    :composeApp:compileKotlinIosArm64 \
                    :composeApp:compileTestKotlinIosSimulatorArm64 --stacktrace

  rules:
    # The security rules are the only thing between a room and anyone with an account, so they get
    # a real test run: the Firebase emulator, against the actual rules file. Java is here because
    # the emulator is a Java process.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/rules-tests/package-lock.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        working-directory: tools/rules-tests
        run: npm ci

      - name: Test the database rules
        working-directory: tools/rules-tests
        run: npm test
