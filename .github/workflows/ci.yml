name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # No google-services.json here on purpose: it is developer-specific and git-ignored, and
      # composeApp/build.gradle.kts only applies the Google Services plugin when the file exists.
      # This job therefore also proves a fresh clone still builds, which is what a reviewer does.
      - name: Test, build and lint
        run: ./gradlew :composeApp:testDebugUnitTest :composeApp:assembleDebug :composeApp:lintDebug --stacktrace

  ios:
    # Compile only, and deliberately so. The iOS targets cannot be *linked* yet: the GitLive
    # Firebase bindings need the Firebase iOS SDK frameworks, which this repo has no Xcode project
    # or CocoaPods integration for (see the iOS issue). Compiling still catches the regression that
    # actually happens — code in commonMain that only works on the JVM.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      - name: Compile the iOS targets
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 :composeApp:compileKotlinIosArm64 --stacktrace
